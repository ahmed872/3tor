      <stop offset="0.14" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="0.9" stop-color="#000000" stop-opacity="0.2"/>
