<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img">
  
  <defs>
    <linearGradient id="bg-story" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F4ECDF"/>
      <stop offset="1" stop-color="#E0D0B8"/>
    </linearGradient>
    <radialGradient id="glow-story" cx="0.5" cy="0.4" r="0.58">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity="0.8"/>
