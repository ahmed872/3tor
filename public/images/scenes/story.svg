      <stop offset="0.45" stop-color="#C0842F"/>
      <stop offset="1" stop-color="#7C4A11"/>
    </linearGradient>
    <linearGradient id="empty-story" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F2C583" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#C0842F" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glass-story" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.14" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="0.9" stop-color="#000000" stop-opacity="0.2"/>
